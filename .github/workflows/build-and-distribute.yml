name: Build and distribute
on:
  workflow_dispatch:
    inputs:
      PACKAGE_VERSION:
        description: 'Package Version'
        required: false
  push:
    branches: [ 'dev/**' ]
    paths:
      - 'api/**'
      - 'lib/**'
      - 'src/**'
      - 'modules/**'
      - '.distignore'
      - 'composer.*'
      - 'package*'
      - 'readme.txt'
      - 'webpack.config.js'
      - '*.php'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-distribute:
    uses: inpsyde/reusable-workflows/.github/workflows/build-and-distribute.yml@e37849e94ffc3e8b7aaae853471815e1b74f99e8 # pinning PR #278
    secrets:
      GITHUB_USER_EMAIL: ${{ secrets.DEPLOYBOT_EMAIL }}
      GITHUB_USER_NAME: ${{ secrets.DEPLOYBOT_USER }}
      GITHUB_USER_SSH_KEY: ${{ secrets.DEPLOYBOT_SSH_PRIVATE_KEY }}
      GITHUB_USER_SSH_PUBLIC_KEY: ${{ secrets.DEPLOYBOT_SSH_PUBLIC_KEY }}
      NPM_REGISTRY_TOKEN: ${{ secrets.DEPLOYBOT_GITHUB_TOKEN_PACKAGES }}
    with:
      PACKAGE_NAME: 'woocommerce-paypal-payments'
      PACKAGE_VERSION: ${{ inputs.PACKAGE_VERSION }}
      NODE_VERSION: 22
