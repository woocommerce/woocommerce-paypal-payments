name: Plugin Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Plugin Check runs against the plugin built by the  "Build and distribute" workflow to avoid noise from code that is not shipped in a release.
  plugin-check:
    name: Run Plugin Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      # Also needed by the Plugin Check action, which writes a .wp-env.json into the workspace.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Wait for and download Build and distribute artifact
        id: fetch
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const script = require('./.github/scripts/fetch-build-artifact.js');
            await script.run({ github, context, core, zipPath: `${process.env.RUNNER_TEMP}/plugin.zip`, maxWait: 15 * 60 * 1000 });

      - name: Unzip artifact
        if: steps.fetch.outputs.has_build == 'true'
        run: unzip -q "${RUNNER_TEMP}/plugin.zip" -d plugin-check-build

      - name: Run Plugin Check
        if: steps.fetch.outputs.has_build == 'true'
        uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: ./plugin-check-build/woocommerce-paypal-payments
          slug: woocommerce-paypal-payments
