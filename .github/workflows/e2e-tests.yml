name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      wp-rc-version:
        description: 'WordPress version for Release Candidate (ex. 6.3-RC3)'
      wc-rc-version:
        description: 'WooCommerce version for Release Candidate (ex. 8.0.0-rc.1)'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  E2ETests:
    name: E2E Tests
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@0f7f1d08e3e32076e51cae65eb0b0c871405b16e
        with:
          php-version: 8.1

      - name: Configure npm for GitHub Packages
        working-directory: ./tests/qa
        run: |
          # Create clean .npmrc
          echo "@inpsyde:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.NPM_SYDE }}" >> .npmrc

      - name: Install dependencies
        working-directory: ./tests/qa
        run: npm run setup:all

      - name: Install WP release candidate (optional)
        if: github.event.inputs.wp-rc-version != ''
        working-directory: ./tests/qa
        env:
          INPUT_WP_RC_VERSION: ${{ github.event.inputs.wp-rc-version }}
        run: |
          npm run -- wp-env run tests-cli -- wp core update --version="${INPUT_WP_RC_VERSION}"
          npm run -- wp-env run tests-cli -- wp core update-db

      - name: Install WC release candidate (optional)
        if: github.event.inputs.wc-rc-version != ''
        working-directory: ./tests/qa
        env:
          INPUT_WC_RC_VERSION: ${{ github.event.inputs.wc-rc-version }}
        run: |
          npm run -- wp-env run tests-cli -- wp plugin update woocommerce --version="${INPUT_WC_RC_VERSION}"
          npm run -- wp-env run tests-cli -- wp wc update

      - name: Run E2E tests
        working-directory: ./tests/qa
        env:
          WP_BASE_URL: 'http://localhost:8889'
          WP_USERNAME: 'admin'
          WP_PASSWORD: 'password'
          WP_BASIC_AUTH_USER: 'admin'
          WP_BASIC_AUTH_PASS: 'password'
          STORAGE_STATE_PATH: './storage-states'
          STORAGE_STATE_PATH_ADMIN: './storage-states/admin.json'
          MERCHANT_USA_EMAIL: ${{ secrets.MERCHANT_USA_EMAIL }}
          MERCHANT_USA_CLIENT_ID:  ${{ secrets.MERCHANT_USA_CLIENT_ID }}
          MERCHANT_USA_CLIENT_SECRET:  ${{ secrets.MERCHANT_USA_CLIENT_SECRET }}
          MERCHANT_USA_ACCOUNT_ID: ${{ secrets.MERCHANT_USA_ACCOUNT_ID }}
        run: |
          cp .env.example .env
          npm run tests:all
