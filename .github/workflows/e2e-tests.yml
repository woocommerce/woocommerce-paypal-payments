name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      test-suite:
        description: 'Test suite to run'
        required: true
        default: 'critical'
        type: choice
        options:
          - critical
          - stress
          - all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build tested plugin package
    uses: inpsyde/reusable-workflows/.github/workflows/build-and-distribute.yml@main
    secrets:
      GITHUB_USER_EMAIL: ${{ secrets.DEPLOYBOT_EMAIL }}
      GITHUB_USER_NAME: ${{ secrets.DEPLOYBOT_USER }}
      GITHUB_USER_SSH_KEY: ${{ secrets.DEPLOYBOT_SSH_PRIVATE_KEY }}
      GITHUB_USER_SSH_PUBLIC_KEY: ${{ secrets.DEPLOYBOT_SSH_PUBLIC_KEY }}
      NPM_REGISTRY_TOKEN: ${{ secrets.NPM_SYDE }}
    with:
      PACKAGE_NAME: woocommerce-paypal-payments
      NODE_VERSION: 22

  E2ETests:
    name: E2E Tests
    needs: build
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: 2
    steps:
      - name: Add custom domain to hosts
        run: echo "127.0.0.1 mywp.site" | sudo tee -a /etc/hosts

      - uses: actions/checkout@v4

      - name: Download and zip plugin artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ github.run_id }} -p "woocommerce-paypal-payments-*" -D tests/qa/resources/files
          cd tests/qa/resources/files
          mv woocommerce-paypal-payments-*/woocommerce-paypal-payments .
          zip -r woocommerce-paypal-payments.zip woocommerce-paypal-payments
          rm -rf woocommerce-paypal-payments woocommerce-paypal-payments-*/

      - name: Configure npm for GitHub Packages
        working-directory: ./tests/qa
        run: |
          echo "@inpsyde:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.NPM_SYDE }}" >> .npmrc

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: "./tests/inc/inpsyde"
        env:
          COMPOSER_AUTH: '{ "http-basic": { "repo.packagist.com": { "username": "${{ secrets.SYDE_COMPOSER_USER }}", "password": "${{ secrets.SYDE_COMPOSER_PASSWORD }}" }}}'

      - name: Install Environment
        working-directory: ./tests/qa
        run: npm run setup:env

      - name: Install Tests
        working-directory: ./tests/qa
        run: npm run setup:tests

      - name: Create .env file
        working-directory: ./tests/qa
        run: |
          echo "${{ secrets.QA_ENV_FILE }}" > .env

      - name: Run E2E tests
        working-directory: ./tests/qa
        env:
          TEST_SUITE: ${{ github.event.inputs.test-suite }}
        run: npm run tests:$TEST_SUITE

      - name: Archive Playwright Report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: tests/qa/playwright-report
          if-no-files-found: ignore
          retention-days: 5

      - name: Archive Test Results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/qa/test-results/
          if-no-files-found: ignore
          retention-days: 5