name: E2E Tests

on:
  workflow_run:
    workflows: [ "Build and distribute" ]
    types: [ completed ]
    branches: [ dev/develop ]
  workflow_dispatch:
    inputs:
      TEST_SUITE:
        description: 'Test suite'
        required: true
        default: 'smoke:parallel'
        type: choice
        options:
          - all:parallel
          - smoke:parallel
          - critical:parallel
          - shard:plugin-foundation
          - shard:onboarding
          - shard:settings
          - shard:transaction-usa
          - shard:transaction-mexico
          - shard:transaction-germany
          - shard:refund
          - shard:vaulting
          - shard:subscription
          - shard:transaction-international
          - stress
      XRAY_TEST_EXEC_KEY:
        description: 'Xray Test Execution Key'
        required: false
        default: ''
        type: string
      SDK_VERSION:
        description: 'PayPal JS SDK version to test'
        required: true
        default: 'v6'
        type: choice
        options:
          - v6
          - v5
          - both

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build tested plugin package
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    uses: inpsyde/reusable-workflows/.github/workflows/build-and-distribute.yml@f414e0b4da6c51adeee419cdd5fbbf299ae0167e # pinning PR #290
    secrets:
      GITHUB_USER_EMAIL: ${{ secrets.DEPLOYBOT_EMAIL }}
      GITHUB_USER_NAME: ${{ secrets.DEPLOYBOT_USER }}
      GITHUB_USER_SSH_KEY: ${{ secrets.DEPLOYBOT_SSH_PRIVATE_KEY }}
      GITHUB_USER_SSH_PUBLIC_KEY: ${{ secrets.DEPLOYBOT_SSH_PUBLIC_KEY }}
      NPM_REGISTRY_TOKEN: ${{ secrets.DEPLOYBOT_GITHUB_TOKEN_PACKAGES }}
    with:
      PACKAGE_NAME: woocommerce-paypal-payments
      NODE_VERSION: 22

  resolve-playwright-matrix:
    name: Resolve Playwright matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      matrix-v6: ${{ steps.resolve.outputs.matrix-v6 }}
      matrix-v5: ${{ steps.resolve.outputs.matrix-v5 }}
    steps:
      - name: Resolve test scripts
        id: resolve
        shell: bash
        run: |
          SHARDS=(
            plugin-foundation
            onboarding
            settings
            transaction-usa
            transaction-mexico
            transaction-germany
            refund
            vaulting
            subscription
            transaction-international
          )

          TEST_SUITE='${{ inputs.TEST_SUITE || 'smoke:parallel' }}'
          SDK_VERSION='${{ inputs.SDK_VERSION || 'both' }}'

          sdk_versions() {
            if [[ "$SDK_VERSION" == "both" ]]; then
              echo "v5 v6"
            else
              echo "$SDK_VERSION"
            fi
          }

          # One matrix per SDK (empty = job skipped); v5 runs after v6 to avoid duplicate orders on shared merchants.
          if [[ "$TEST_SUITE" == *':parallel' ]]; then
            SUFFIX=""
            [[ "$TEST_SUITE" != "all:parallel" ]] && SUFFIX=":${TEST_SUITE%:parallel}"
            SCRIPTS=()
            NAMES=()
            for shard in "${SHARDS[@]}"; do
              SCRIPTS+=("e2e:test:shard:${shard}${SUFFIX}")
              NAMES+=("$shard")
            done
          else
            SCRIPTS=("e2e:test:${TEST_SUITE}")
            NAMES=("${TEST_SUITE#shard:}")
          fi

          for v in v6 v5; do
            MATRIX=""
            if [[ " $(sdk_versions) " == *" $v "* ]]; then
              ITEMS=()
              for i in "${!SCRIPTS[@]}"; do
                ITEMS+=("{\"script\":\"${SCRIPTS[$i]}\",\"name_suffix\":\" / ${NAMES[$i]} / ${v}\",\"artifact_name\":\"playwright-artifact-${NAMES[$i]}-${v}\",\"sdk_version\":\"${v}\",\"slug\":\"${NAMES[$i]}\"}")
              done
              MATRIX="{\"include\":[$(IFS=,; echo "${ITEMS[*]}")]}"
            fi
            echo "matrix-${v}=${MATRIX}" >> "$GITHUB_OUTPUT"
          done

  e2e-playwright-v6:
    name: Run Playwright E2E Tests${{ matrix.name_suffix }}
    needs:
      - build
      - resolve-playwright-matrix
    if: needs.resolve-playwright-matrix.outputs.matrix-v6 != ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-playwright-matrix.outputs.matrix-v6) }}
    uses: inpsyde/reusable-workflows/.github/workflows/test-playwright.yml@236c6b5a7fea73b5058b6f11bd17ff4b80994e54 # pinning PR #292
    with: &playwright-inputs
      PLAYWRIGHT_SCRIPT: ${{ matrix.script }}
      PLAYWRIGHT_ARTIFACT_NAME: ${{ matrix.artifact_name }}
      PLAYWRIGHT_ARTIFACT_PATH: |
        artifacts/*
        playwright-report/
        test-results/
      PLAYWRIGHT_ARTIFACT_INCLUDE_HIDDEN_FILES: true
      NODE_VERSION: 22
      PLAYWRIGHT_BROWSER_ARGS: 'chromium --with-deps'
      XRAY_TEST_EXEC_KEY: ${{ inputs.XRAY_TEST_EXEC_KEY }}
      # Tunnel only for shards that wait on a PayPal webhook (PUI/OXXO capture, refund from PayPal).
      NGROK_ENABLED: ${{ contains(fromJson('["transaction-germany","transaction-mexico","refund"]'), matrix.slug) }}
      # Fixed per shard+SDK (no run id) so the webhook is replaced, not orphaned; overlapping runs of a shard collide.
      NGROK_DOMAIN: ${{ matrix.slug }}-${{ matrix.sdk_version }}.e2e.paypal.syde.wpinfra.cloud
      # Site stays local; only the webhook URL goes through the tunnel (see e2e-snippets.php)
      NGROK_REWRITE_URLS: false
      PRE_SCRIPT: |
        # Tunnel host for e2e-snippets.php; its presence tells 03-pcp.setup.ts the tunnel is on.
        if [ -n "$NGROK_URL" ]; then
          echo -n "${NGROK_URL#https://}" > tests/qa/resources/e2e-snippets/ngrok-host.txt
        fi

        # 0. v6 is the default; v5 jobs set PCP_JS_SDK_VERSION (read via .env.ci) for the flag and locators.
        if [ "${{ matrix.sdk_version }}" = "v5" ]; then
          echo "PCP_JS_SDK_VERSION=v5" >> .env.ci
        fi

        # 1. Download and unzip the built plugin
        gh run download ${{ github.run_id }} -p "woocommerce-paypal-payments-*" -D tests/qa/resources/files
        (
          cd tests/qa/resources/files
          mv woocommerce-paypal-payments-*/woocommerce-paypal-payments .
          zip -rq woocommerce-paypal-payments.zip woocommerce-paypal-payments
          rm -rf woocommerce-paypal-payments woocommerce-paypal-payments-*/
        )

        # 2. Add private composer repository and download WooCommerce Subscriptions
        composer config repositories.repo-name composer https://repo.packagist.com/inpsyde/payment-gateways/
        composer require "inpsyde-mirror/woocommerce-subscriptions"
    secrets: &playwright-secrets
      ENV_FILE_DATA: ${{ secrets.QA_ENV_FILE }}
      NPM_REGISTRY_TOKEN: ${{ secrets.DEPLOYBOT_GITHUB_TOKEN_PACKAGES }}
      COMPOSER_AUTH_JSON: ${{ secrets.COMPOSER_AUTH_JSON }}
      NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}

  # Runs after v6 (whatever its result) so both SDKs never order on the shared merchants at once.
  e2e-playwright-v5:
    name: Run Playwright E2E Tests${{ matrix.name_suffix }}
    needs:
      - build
      - resolve-playwright-matrix
      - e2e-playwright-v6
    if: >-
      !cancelled() &&
      needs.build.result == 'success' &&
      needs.resolve-playwright-matrix.outputs.matrix-v5 != ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-playwright-matrix.outputs.matrix-v5) }}
    uses: inpsyde/reusable-workflows/.github/workflows/test-playwright.yml@236c6b5a7fea73b5058b6f11bd17ff4b80994e54 # pinning PR #292
    with: *playwright-inputs
    secrets: *playwright-secrets
